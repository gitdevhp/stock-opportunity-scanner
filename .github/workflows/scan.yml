name: Stock Opportunity Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: true
        default: evening
        type: choice
        options:
          - morning
          - intraday
          - evening

  schedule:
    # GitHub Actions cron uses UTC.
    #
    # These candidate runs cover both CDT (UTC-5) and CST (UTC-6).
    # scanner.py determines whether the current America/Chicago time
    # is actually one of our desired scan windows.
    #
    # Morning: 08:00 Central
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"

    # Intraday: 09:00 through 15:00 Central
    - cron: "0 14-21 * * 1-5"

    # Evening: 16:00 Central
    - cron: "0 21 * * 1-5"
    - cron: "0 22 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine scan mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ=America/Chicago date +%H)
            MIN=$(TZ=America/Chicago date +%M)
            TOTAL=$((10#$HOUR * 60 + 10#$MIN))

            # Morning: 08:00-08:25 Central
            if [ "$TOTAL" -ge 480 ] && [ "$TOTAL" -le 505 ]; then
              echo "mode=morning" >> "$GITHUB_OUTPUT"

            # Intraday: 09:00-15:20 Central
            elif [ "$TOTAL" -ge 540 ] && [ "$TOTAL" -le 920 ]; then
              echo "mode=intraday" >> "$GITHUB_OUTPUT"

            # Evening: 16:00-16:25 Central
            elif [ "$TOTAL" -ge 960 ] && [ "$TOTAL" -le 985 ]; then
              echo "mode=evening" >> "$GITHUB_OUTPUT"

            else
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run scanner and send Discord report
        if: steps.mode.outputs.mode != 'none'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scanner.py --mode "${{ steps.mode.outputs.mode }}" --send

      - name: Upload report
        if: steps.mode.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: stock-scan-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
